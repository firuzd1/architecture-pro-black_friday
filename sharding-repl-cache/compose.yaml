name: sharding-repl-cache

services:
  pymongo_api:
    container_name: pymongo_api
    build:
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos_router
      - redis
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos_router:27020"
      MONGODB_DATABASE_NAME: "somedb"
      REDIS_URL: "redis://redis:6379"

  redis:
    container_name: redis
    image: dh-mirror.gitverse.ru/redis:latest
    ports:
      - 6379:6379

  mongos_router:
    container_name: mongos_router
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongos --port 27020 --configdb config_server/configSrv:27017 --bind_ip_all
    depends_on:
      - configSrv

  configSrv:
    container_name: configSrv
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --port 27017 --configsvr --replSet config_server --bind_ip_all
    volumes:
      - configSrv_data:/data/db

  shard1-1:
    container_name: shard1-1
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --port 27018 --shardsvr --replSet shard1 --bind_ip_all
    volumes:
      - shard1-1_data:/data/db

  shard1-2:
    container_name: shard1-2
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --port 27018 --shardsvr --replSet shard1 --bind_ip_all
    volumes:
      - shard1-2_data:/data/db

  shard1-3:
    container_name: shard1-3
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --port 27018 --shardsvr --replSet shard1 --bind_ip_all
    volumes:
      - shard1-3_data:/data/db

  shard2-1:
    container_name: shard2-1
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --port 27019 --shardsvr --replSet shard2 --bind_ip_all
    volumes:
      - shard2-1_data:/data/db

  shard2-2:
    container_name: shard2-2
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --port 27019 --shardsvr --replSet shard2 --bind_ip_all
    volumes:
      - shard2-2_data:/data/db

  shard2-3:
    container_name: shard2-3
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --port 27019 --shardsvr --replSet shard2 --bind_ip_all
    volumes:
      - shard2-3_data:/data/db

volumes:
  configSrv_data:
  shard1-1_data:
  shard1-2_data:
  shard1-3_data:
  shard2-1_data:
  shard2-2_data:
  shard2-3_data: