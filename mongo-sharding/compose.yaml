name: mongo-sharding

services:
  pymongo_api:
    container_name: pymongo_api
    build:
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos_router
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos_router:27020"
      MONGODB_DATABASE_NAME: "somedb"

  mongos_router:
    container_name: mongos_router
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongos --port 27020 --configdb config_server/configSrv:27017 --bind_ip_all
    depends_on:
      - configSrv
    ports:
      - 27020:27020

  configSrv:
    container_name: configSrv
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --port 27017 --configsvr --replSet config_server --bind_ip_all
    volumes:
      - configSrv_data:/data/db

  shard1:
    container_name: shard1
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --port 27018 --shardsvr --replSet shard1 --bind_ip_all
    volumes:
      - shard1_data:/data/db

  shard2:
    container_name: shard2
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --port 27019 --shardsvr --replSet shard2 --bind_ip_all
    volumes:
      - shard2_data:/data/db

volumes:
  configSrv_data:
  shard1_data:
  shard2_data: